name: Bug report
description: Something in the app isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Role / portal
      description: Which role's screens does this affect?
      options:
        - Patient
        - Front desk
        - Doctor
        - Nurse
        - Lab
        - Pharmacy
        - Billing
        - Admin
        - Not role-specific / other
    validations:
      required: true

  - type: input
    id: route
    attributes:
      label: Page / route
      description: e.g. /billing/bills/[id]
      placeholder: /billing
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include which demo account you used (see README for seeded logins), if relevant.
      placeholder: |
        1. Log in as billing@hms.dev
        2. Go to ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Screenshots / error output
      description: Paste any relevant console/server error output or screenshots.
    validations:
      required: false
